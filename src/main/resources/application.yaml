spring:
  application:
    name: rag

  datasource:
    url: jdbc:postgresql://localhost:5432/rag
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        options:
          model: llama3.2:3b
          temperature: 0.2

      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  port: 8080